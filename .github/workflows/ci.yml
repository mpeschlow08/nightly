name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      NEXT_PUBLIC_APP_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/nightly_ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      CLERK_SECRET_KEY: sk_test_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Agent dependencies
        run: npm ci --prefix agent

      - name: Build Agent
        run: npm run build --prefix agent

      - name: Install Agent media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Test Agent
        run: npm test --prefix agent

      - name: Lint
        run: npm run lint

      - name: Environment validation
        run: npm run env:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Secret scan
        run: npm run security:secret-scan

      - name: Dependency audit (high+)
        run: npm run security:deps-audit

      - name: Build
        run: npm run build
